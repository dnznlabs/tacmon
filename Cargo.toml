[package]
name = "tacmon"
version = "0.1.0-alpha"
edition = "2024"
description = "A terminal activity monitor for Tacit services"
license = "MIT"
repository = "https://github.com/dnznlabs/tacmon"

[[bin]]
name = "tacmon"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "io-util", "sync", "fs"] }
toml = "1.2.2"
