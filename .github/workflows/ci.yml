name: ci

on:
  pull_request:
  push:
    branches: [main]

# A pull request from a fork runs this with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The same commands a contributor runs, so a green `make lint test` locally means green here.
      - run: make lint
      - run: make test
      # --locked: a change to Cargo.toml without its Cargo.lock fails here instead of resolving quietly.
      - run: cargo build --release --locked
