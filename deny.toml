# What `make audit-checks` holds the dependency tree to. Every exception is written here with its reason.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisories against Cargo.lock: vulnerabilities and unsound code fail by default.
# Unmaintained crates fail too, wherever they sit in the tree.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. A new one is added here, on purpose, in the change that brings it in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-root-certs: the bundled root certificates, data rather than code
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second TLS stack would change what SECURITY.md says about the network.
deny = [
    { crate = "openssl", reason = "rustls is the only TLS stack" },
    { crate = "openssl-sys", reason = "rustls is the only TLS stack" },
    { crate = "native-tls", reason = "rustls is the only TLS stack" },
]

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
